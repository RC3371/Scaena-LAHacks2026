    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --neon-pink: #FF00FF;
            --neon-cyan: #00FFFF;
            --neon-green: #39FF14;
            --neon-yellow: #FFFF00;
            --neon-purple: #9D00FF;
            --dark-bg: #110022;
            --panel-bg: #220044;
        }
    }

    @layer base {
        body {
            @apply bg-[var(--dark-bg)] text-white;
            font-family: 'Space Mono', monospace;
            background-color: var(--dark-bg);
            background-image: radial-gradient(var(--neon-purple) 2px, transparent 2px);
            background-size: 30px 30px;
        }
        h1, h2, h3, .pixel-text {
            font-family: 'Bungee', cursive;
            letter-spacing: 1px;
        }
    }

    @layer components {
        .y2k-panel {
            @apply bg-[var(--panel-bg)] border-4 border-black rounded-2xl shadow-[6px_6px_0px_0px_rgba(255,0,255,1)];
        }
        .y2k-panel-cyan {
            @apply bg-[var(--panel-bg)] border-4 border-black rounded-2xl shadow-[6px_6px_0px_0px_rgba(0,255,255,1)];
        }
        .y2k-btn {
            @apply px-4 py-2 bg-[var(--neon-green)] text-black border-4 border-black rounded-full uppercase tracking-wider hover:bg-[var(--neon-yellow)] hover:-translate-y-1 hover:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transition-all cursor-pointer font-bold;
        }
        .y2k-btn-pink {
            @apply px-4 py-2 bg-[var(--neon-pink)] text-black border-4 border-black rounded-full uppercase tracking-wider hover:bg-[var(--neon-cyan)] hover:-translate-y-1 hover:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] transition-all cursor-pointer font-bold;
        }
    }
    </style>

</body>
